# Local or VPS n8n for LeadPilot. Start with: docker compose up -d
# Then open http://localhost:5678 and import the files in n8n/workflows/.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Johannesburg}
      - TZ=${GENERIC_TIMEZONE:-Africa/Johannesburg}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - ./n8n_data:/home/node/.n8n
